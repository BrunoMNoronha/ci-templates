# Workflow reutilizável de CI para projetos Node.js com pnpm.
#
# Uso (no repositório consumidor, em .github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: BrunoMNoronha/ci-templates/.github/workflows/node-ci.yml@v1
#       with:
#         postgres: true
#         prisma: true
#
# Este workflow NÃO recebe secrets. O PostgreSQL opcional é um container de
# serviço efêmero, criado e destruído junto com o job; nenhuma URL de ambiente
# real (Preview/Production) deve ser passada para cá.
#
# Atenção ao nome do check: quando chamado como reusable workflow, o check
# aparece como "<job do chamador> / <job-name>". Rulesets que exigem checks
# pelo nome precisam ser atualizados ao migrar um repositório.
name: Node CI (reutilizável)

on:
  workflow_call:
    inputs:
      job-name:
        description: Nome exibido do job.
        type: string
        default: Lint, typecheck, testes e build
      runs-on:
        description: Runner. Fixado para evitar migrações automáticas do ubuntu-latest.
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: Tempo máximo do job.
        type: number
        default: 15
      working-directory:
        description: Diretório do projeto dentro do repositório.
        type: string
        default: .
      node-version:
        description: Versão do Node.js (usada quando node-version-file está vazio).
        type: string
        default: "24"
      node-version-file:
        description: >-
          Caminho de um arquivo de versão (package.json, .nvmrc ou .node-version)
          relativo a working-directory. Tem prioridade sobre node-version e é a
          forma recomendada: a versão passa a vir do repositório.
        type: string
        default: ""
      pnpm-version:
        description: Versão do pnpm. Vazio = usar o campo packageManager do package.json.
        type: string
        default: ""
      postgres:
        description: Sobe um PostgreSQL efêmero e exporta DATABASE_URL.
        type: boolean
        default: false
      postgres-image:
        description: Imagem do PostgreSQL efêmero (iguale à de produção do projeto).
        type: string
        default: postgres:17-alpine
      postgres-db:
        description: >-
          Nome do banco efêmero (usuário e senha são fixos e descartáveis).
          Útil quando os testes só aceitam um nome de banco específico.
        type: string
        default: ci
      prisma:
        description: Executa prisma validate e, com postgres, prisma migrate deploy.
        type: boolean
        default: false
      next-cache:
        description: Mantém o cache de build do Next.js (.next/cache) entre execuções.
        type: boolean
        default: true
      format-check:
        description: Executa "pnpm run format:check" (ignorado se o script não existir).
        type: boolean
        default: false
      lint:
        description: Executa "pnpm run lint" (ignorado se o script não existir).
        type: boolean
        default: true
      typecheck:
        description: Executa "pnpm run typecheck" (ignorado se o script não existir).
        type: boolean
        default: true
      test:
        description: Executa "pnpm run test" (ignorado se o script não existir).
        type: boolean
        default: true
      build:
        description: Executa "pnpm run build" (ignorado se o script não existir).
        type: boolean
        default: true
      extra-scripts:
        description: >-
          Scripts pnpm adicionais rodados após o build, um por linha, cada um
          com "pnpm run --if-present <script>". Só nomes de script
          (ex.: test:db, test:integration), nunca comandos arbitrários.
        type: string
        default: ""
      env:
        description: >-
          Variáveis NÃO sensíveis exclusivas da CI, uma por linha no formato
          CHAVE=valor. Nunca use para secrets ou URLs de ambientes reais.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validacao:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    services:
      postgres:
        # Imagem vazia = serviço não é iniciado.
        image: ${{ inputs.postgres && inputs.postgres-image || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_ephemeral
          POSTGRES_DB: ${{ inputs.postgres-db }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ${{ inputs.postgres-db }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Exportar variáveis da CI
        if: inputs.env != ''
        env:
          CI_ENV: ${{ inputs.env }}
        run: |
          while IFS= read -r linha; do
            [ -z "$linha" ] && continue
            if ! [[ "$linha" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "Linha inválida em 'env' (esperado CHAVE=valor): $linha" >&2
              exit 1
            fi
            echo "$linha" >> "$GITHUB_ENV"
          done <<< "$CI_ENV"

      - name: Exportar DATABASE_URL do banco efêmero
        if: inputs.postgres
        env:
          POSTGRES_DB_NAME: ${{ inputs.postgres-db }}
        run: |
          if ! [[ "$POSTGRES_DB_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "postgres-db inválido: $POSTGRES_DB_NAME" >&2
            exit 1
          fi
          echo "DATABASE_URL=postgresql://ci:ci_ephemeral@localhost:5432/${POSTGRES_DB_NAME}?schema=public" >> "$GITHUB_ENV"

      # Restaurado antes do install para que o hash não percorra node_modules.
      # A chave usa o lockfile + o SHA do commit; restore-keys cai no cache mais
      # recente do mesmo lockfile. Evita re-hashear todo o código-fonte.
      - name: Cache do build do Next.js
        if: inputs.next-cache && inputs.build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}-

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file != '' && format('{0}/{1}', inputs.working-directory, inputs.node-version-file) || '' }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar schema do Prisma
        if: inputs.prisma
        run: pnpm exec prisma validate

      - name: Aplicar migrations no banco efêmero
        if: inputs.prisma && inputs.postgres
        run: pnpm exec prisma migrate deploy

      - name: Formatação
        if: inputs.format-check
        run: pnpm run --if-present format:check

      - name: Typecheck
        if: inputs.typecheck
        run: pnpm run --if-present typecheck

      - name: Lint
        if: inputs.lint
        run: pnpm run --if-present lint

      - name: Testes
        if: inputs.test
        run: pnpm run --if-present test

      - name: Build
        if: inputs.build
        run: pnpm run --if-present build

      - name: Scripts adicionais
        if: inputs.extra-scripts != ''
        env:
          EXTRA_SCRIPTS: ${{ inputs.extra-scripts }}
        run: |
          while IFS= read -r script; do
            script="$(echo "$script" | tr -d '[:space:]')"
            [ -z "$script" ] && continue
            if ! [[ "$script" =~ ^[A-Za-z0-9:_-]+$ ]]; then
              echo "Nome de script inválido em 'extra-scripts': $script" >&2
              exit 1
            fi
            echo "::group::pnpm run $script"
            pnpm run --if-present "$script"
            echo "::endgroup::"
          done <<< "$EXTRA_SCRIPTS"
