# Workflow reutilizável de deploy na Vercel (pull, build e deploy --prebuilt),
# com migração opcional do banco. Consome um SHA já validado pela CI; não roda
# lint/typecheck/test de novo.
#
# Uso:
#   jobs:
#     deploy:
#       uses: BrunoMNoronha/ci-templates/.github/workflows/vercel-deploy.yml@v1
#       with:
#         environment: production
#         ref: ${{ inputs.sha }}
#         prod: true
#         run-migrations: true
#       secrets:
#         VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
#         VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
#         VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
#         MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
name: Deploy Vercel (reutilizável)

on:
  workflow_call:
    inputs:
      environment:
        description: Nome do GitHub Environment e alvo do "vercel pull".
        required: true
        type: string
      ref:
        description: Commit (SHA) exato a publicar.
        required: true
        type: string
      prod:
        description: Deploy de produção (--prod). Falso = preview.
        type: boolean
        default: false
      run-migrations:
        description: Roda migrate-command com MIGRATION_DATABASE_URL antes do build.
        type: boolean
        default: false
      migrate-command:
        description: Comando de migração.
        type: string
        default: pnpm exec prisma migrate deploy
      vercel-version:
        description: Versão fixada da CLI da Vercel.
        type: string
        default: 62.2.0
      node-version-file:
        description: Arquivo de versão do Node, relativo a working-directory.
        type: string
        default: package.json
      working-directory:
        description: Diretório do projeto.
        type: string
        default: .
      timeout-minutes:
        type: number
        default: 30
      runs-on:
        type: string
        default: ubuntu-24.04
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      MIGRATION_DATABASE_URL:
        required: false
    outputs:
      url:
        description: URL do deployment publicado.
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@${{ inputs.vercel-version }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ${{ format('{0}/{1}', inputs.working-directory, inputs.node-version-file) }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Conferir configuração da Vercel
        run: |
          : "${VERCEL_TOKEN:?Configure o secret VERCEL_TOKEN.}"
          : "${VERCEL_ORG_ID:?Configure o secret VERCEL_ORG_ID.}"
          : "${VERCEL_PROJECT_ID:?Configure o secret VERCEL_PROJECT_ID.}"

      - name: Puxar configuração do ambiente
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=${{ inputs.prod && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: Aplicar migrações
        if: inputs.run-migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          : "${DATABASE_URL:?run-migrations exige o secret MIGRATION_DATABASE_URL.}"
          ${{ inputs.migrate-command }}

      - name: Build
        run: pnpm dlx "$VERCEL_CLI" build ${{ inputs.prod && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Publicar
        id: deploy
        run: |
          url="$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt ${{ inputs.prod && '--prod' || '' }} --yes \
            --meta releaseSha="${{ inputs.ref }}" --meta releaseRunId="$GITHUB_RUN_ID" \
            --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url" >> "$GITHUB_STEP_SUMMARY"
