version: 2
updates:
  # Mantém os SHAs das ações usadas nos workflows reutilizáveis atualizados.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Agrupa tudo (inclusive majors) num único PR semanal: mantém as ações em
    # runtime suportado (ex.: fim do Node 20) sem abrir vários PRs. O selftest
    # valida o grupo antes do merge.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
