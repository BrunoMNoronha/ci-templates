# Exemplo de .github/workflows/ci.yml em um repositório consumidor.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Em PR, um push novo cancela a execução anterior. Na main nunca cancela:
# cada commit da main precisa terminar com o check verde.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    # PR em rascunho não roda CI; roda ao marcar "Ready for review".
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: BrunoMNoronha/ci-templates/.github/workflows/node-ci.yml@main
    with:
      postgres: true
      prisma: true
      env: |
        AUTH_SESSION_SECRET=ci-only-nao-usar-fora-da-ci-0123456789
