# Exemplo: publicar Produção manualmente, informando o SHA já homologado.
# O environment "production" deve exigir revisor no GitHub (Settings > Environments).
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit já homologado em Preview.
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    uses: BrunoMNoronha/ci-templates/.github/workflows/vercel-deploy.yml@v1
    with:
      environment: production
      ref: ${{ inputs.sha }}
      prod: true
      run-migrations: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
