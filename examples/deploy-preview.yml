# Exemplo: publicar Preview quando a CI concluir com sucesso na branch production.
# O deploy consome o SHA já validado — não reexecuta a CI.
name: deploy-preview

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [production]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success'
    uses: BrunoMNoronha/ci-templates/.github/workflows/vercel-deploy.yml@v1
    with:
      environment: preview
      ref: ${{ github.event.workflow_run.head_sha }}
      prod: false
      run-migrations: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MIGRATION_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
